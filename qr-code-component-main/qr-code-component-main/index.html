<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    html{
      width: 100%;
      height: 100%;
    }
    body{
      width: 100%;
      height: 100%;
      margin:0;
      background-color:#d5e1ef;
    }
    .attribution { font-size: 0.6875rem; text-align: center;width: 80%; }
    .attribution a { color: hsl(228, 45%, 44%);}
    .marginBottom{
      margin-bottom:15px;
    }
    .boldText{
      font-size:1.2rem;
      font-weight: bold;
    }
    .container{
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;

    }
    .content{
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width:18%;
      border-radius:10px;
      background-color: white;
      padding-bottom: 2cqw;
    }
    .qr{
      margin-top:4.5cqw;
      margin-bottom: 20px;
      border-radius:10px;
      width:92%;
    }
  </style>
</head>

<body>
  
  <div class="container">
    <div class="content">
    <img class = "qr marginBottom" src="./images/image-qr-code.png" alt="null">
    <div class = "boldText attribution marginBottom">Improve your front-end skills by building projects</div>
    <div class="attribution a">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</div>
    </div>
    
  </div>
  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
