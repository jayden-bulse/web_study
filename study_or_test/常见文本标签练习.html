<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签练习</title>
</head>
<body>
    <!-- 标题标签有h1~h6 -->
    <h1>这是一级标签</h1>
    <h2>这是二级标签</h2>
    <h3>这是三级标签</h3>
    <h4>这是四级标签</h4>
    <h5>这是五级标签</h5>
    <h6>这是六级标签</h6>
    <!-- 段落标签是p标签 -->
     <div>这是一个div标签</div>
     <p>这是一个段落</p>
     <p>更改文本样式：<b>这是粗体</b>,<s>这是删除线</s>,<i>这是斜体</i>,<u>这是下划线</u></p>
     <!-- 无序列表标签 -->
     <ul>
        <li>无序元素1</li>
        <li>无序元素2</li>
        <li>无序元素3</li>
     </ul>
        <!-- 有序列表标签 -->
     <ol>
        <li>有序元素1</li>
        <li>有序元素2</li>
        <li>有序元素3</li>
     </ol>
     <!-- 表格标签 -->
      <h2>tr标签是table row</h2>
      <h2>td标签的意思是 table data</h2>
      <h2>th标签的意思是 table header</h2>
     <table border="1" >
        <tr>
            <th>列标题1</th>
            <th>列标题2</th>
            <th>列标题3</th>
        </tr>
        <tr>
            <td>数据1</td>
            <td>数据2</td>
            <td>数据3</td>
        </tr>
         <tr>
            <td>数据12</td>
            <td>数据21</td>
            <td>数据35</td>
        </tr>
        <tr>
            <td>数据42</td>
            <td>数据29</td>
            <td>数据30</td>
        </tr>
     </table>
</body>
</html>
