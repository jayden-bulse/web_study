<!DOCTYPE html>
<!-- 行内元素只占据只是所需的的宽度，不会独占一行 -->
 <!-- 块级元素会从新行开始，并且占据整行的宽度，因此呈现为一块独立的内容块 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML区块</title>
</head>
<body>
    <div class="nav">
        <a href = "">标签1</a>
        <a href = "">标签2</a>
        <a href = "">标签3</a>
        <a href = "">标签4</a>
    </div>
    <div>
        <h1>标题</h1>
        <p>文章内容</p>
        <p>文章内容</p>
        <p>文章内容</p>
        <p>文章内容</p>
        <p>文章内容</p>
    </div>
    <span>span标签,<a href = "">我是链接</a></span>
    <span>span标签,<a href = "">我是链接</a></span>
    <hr>
    <span>span标签,<a href = "">我是链接</a></span>
    <span>span标签,<a href = "">我是链接</a></span>
    <span></span>
</body>
</html>
