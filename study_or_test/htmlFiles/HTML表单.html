<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML表单</title>
</head>
<body>
    <!-- action属性用来填写将表单数据发送到的位置的url -->
     <!-- input常用属性：type，name，value，placeholder，id
     type 常用的属性值：text ，radio，checkbox，password，submit -->
    <form action="#">
          <label >用户名:</label>
        <input type="text" placeholder ="请输入账户名"><br><br>
        <label for="pwd">密码:</label>
         <input type="password" id="pwd" placeholder="请输入密码"><br><br>
         <label>性别：</label>
         <input type="radio" name="gender"> 男
         <input type="radio" name = "gender"> 女
         <input type="radio" name = "gender"> 其他 <br><br>
         <label>爱好：</label>
         <input type="checkbox" name = "hobby"> 唱歌
         <input type="checkbox" name = "hobby"> 跳舞
         <input type="checkbox" name = "hobby"> RAP
         <input type="checkbox" name = "hobby"> 篮球<br><br>
         <input type="submit" value = "上传"> 
    </form>
</body>
</html>
