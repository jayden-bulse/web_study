<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位</title>
    <style>
        .box1{
            background-color: lightblue;
            width: 100vw;
            height: 400px;
        }
        .box2{
            background-color: lightgreen;
            width: 100vw;
            height: 400px;
            position:relative;
        }
        .box-normal{
            width:100px;
            height:100px;
            background-color: #002FA7;
        }
        .box-relative{
            width: 100px;
            height:100px;
            background-color: red;
            position:relative;
            left:150px;
        }
        .box-absolute{
            width: 100px;
            height: 100px;
            background-color: pink;
            position: absolute;
            left:200px;
            top:0px;
        }
        .box3{
            width: 100vw;
            height: 400px;
            background-color: palegoldenrod;
        }
        .box-fixed{
            position: fixed;
            width: 100px;
            height: 100px;
            right: 0px;
            top:520px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <h1>相对定位</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="box-relative"></div>
        <div class="box-normal"></div>
    </div>
    <h1>绝对定位</h1>
    <div class="box2">
        <div class="box-normal"></div>
        <div class="box-absolute"></div>
        <div class="box-normal"></div>
    </div>
    <h1>固定定位</h1>
    <div class="box3">
        <div class="box-normal"></div>
        <div class="box-fixed"></div>
        <div class="box-normal"></div>
    </div>
</body>
</html>
